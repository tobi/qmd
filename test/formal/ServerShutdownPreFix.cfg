\* NEGATIVE CONTROL (pre-fix order): the shipped machinery (gate, shared stop
\* promise, bounded drain) but with mcpHandler.close() issued by stop() BEFORE
\* the drain, which is the bug this change fixed.
\* Expect: exit 12 -- "Invariant NoTransportCloseUnderHandler is violated".
\*
\* Minimal trace:
\*   <Initial>          lifecycle "serving", transport open, store open
\*   Arrive(r1)         admitted; the handler starts reading its body
\*   EnterStop(sigterm) beginDrain() -> "draining", mcpHandler.close() issued
\*   => an admitted request is still executing while its transport is closed.
\*      In the code, mcpHandler.fetch() then throws "This MCP handler has been
\*      closed", the handler's catch answers 500, and the client that was
\*      already admitted loses its request.
\*
\* Kept as a regression witness: the shipped order (CloseTransportAtStop =
\* FALSE) closes the transport only after the drain, and this config is what
\* the model reports if that order is undone.
SPECIFICATION Spec

CONSTANTS
    Reqs = {"r1"}
    Callers = {"sigterm", "sigint"}
    AdmissionGate = TRUE
    SharedStop = TRUE
    DrainAtAll = TRUE
    BoundedDrain = TRUE
    AbandonAtDeadline = TRUE
    CloseTransportAtStop = TRUE
    EarlyExitOnTimeout = TRUE

INVARIANTS
    TypeOK
    SaneShutdownOrder
    NoTransportCloseUnderHandler
    NoStoreCloseUnderHandler
    StoppedImpliesStoreClosed
    ReportedTimeoutImpliesAbandoned
    CleanExitImpliesTeardown
    TimeoutExitImpliesWork

CHECK_DEADLOCK FALSE
