\* CURRENT CODE. A store opening its index reads the file under the config lock
\* and mirrors SQLite in the same critical section; an SDK mutation publishes the
\* file, then mirrors it and invalidates the stored hash under that same lock, so
\* no completed operation can leave the rows behind or ahead of the file.
\* Expect: exit 0, TypeOK, Mirror and CertCurrent hold.
SPECIFICATION Spec
CONSTANTS
  SyncMode = "locked"
  MutationMode = "locked"
  Mutates = TRUE

INVARIANTS TypeOK Mirror CertCurrent
CHECK_DEADLOCK FALSE
