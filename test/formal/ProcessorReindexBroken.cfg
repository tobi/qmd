\* ABLATION 1: the ownership re-check inside the savepoint is dropped -- the
\* plausible "the pre-check already looked, why query twice?" simplification
\* that the code's own comment argues against.
\*
\* Same episode as ProcessorReindex.cfg: R1 enumerated "a" before the user
\* replaced it with a directory, R2 enumerated "a/x" after; both publish to
\* "a/x/y".
\*
\* Expect: exit 12, "Invariant ContentMatchesOwner is violated".
\*
\* Trace (6 steps):
\*   Inspect(s1)        R1 read "a" and its processor returned; path unowned
\*   Inspect(s2)        R2 read "a/x" after the replacement; processor returned
\*   PrecheckPasses(s1) ownershipOf -> "unowned", not foreign
\*   PrecheckPasses(s2) ownershipOf -> "unowned", not foreign
\*   Publish(s2)        inserts the ownership row with source = s2 and the
\*                      documents row with s2's markdown
\*   Publish(s1)        with the re-check removed, the upsert keeps
\*                      source = s2 while the documents row is replaced with
\*                      s1's markdown and s1's fingerprint is recorded
\*   => an active document rendered by s1 that processor_outputs credits to s2;
\*      s2's next run overwrites or deletes it via deleteOwnedOutput. The same
\*      state violates FingerprintMatchesPublished: s1's fingerprint promises
\*      an output s1 does not own, so s1 answers "unchanged" forever.
\*
\* The two Publish steps may swap order: same length, same violation. The
\* pre-check is NOT what saves the code -- it ran before the other run
\* published. Only the in-savepoint re-check sees the change.
SPECIFICATION Spec

CONSTANTS
    OldSource = s1
    NewSource = s2
    Active = {s1, s2}
    RecheckInside = FALSE
    OwnershipCheck = TRUE

INVARIANTS TypeOK ContentMatchesOwner RawRowNotClaimed FingerprintMatchesPublished

CHECK_DEADLOCK FALSE
