\* CURRENT CODE. generateEmbeddings takes the per-index embed lock for the whole
\* run, so a second run cannot publish chunks between this run's partial-hash
\* read and its delete. The public vector clear takes the same lock, so it waits
\* for a run instead of interleaving with it.
\* Expect: exit 0, TypeOK, CompletedVectorsRemain and NoClearDuringRun hold.
SPECIFICATION Spec

CONSTANTS
    LockDomain = TRUE
    AtomicDelete = FALSE
    ClearMode = "guarded"
    Clears = TRUE

INVARIANTS TypeOK CompletedVectorsRemain NoClearDuringRun

CHECK_DEADLOCK FALSE
