\* CONTROL, HYPOTHETICAL -- not the current code. A lock-free alternative:
\* removeIncompleteEmbeddings re-checks the chunk count and deletes in one
\* transaction, so a hash that became complete under another run survives.
\* Expect: exit 0, TypeOK and CompletedVectorsRemain hold.
SPECIFICATION Spec

CONSTANTS
    LockDomain = FALSE
    AtomicDelete = TRUE
    ClearMode = "guarded"
    Clears = TRUE

INVARIANTS TypeOK CompletedVectorsRemain NoClearDuringRun

CHECK_DEADLOCK FALSE
