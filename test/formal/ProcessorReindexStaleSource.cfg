\* CURRENT CODE, one run only: "a" is a regular file again (this run enumerates
\* ["a"]), and the processor_sources row for "a/x" is what a previous run left
\* behind when "a" was a directory. Nothing is concurrent -- this is the "stale
\* ownership from a prior scan" half of the collision story, the one that needs
\* no replacement in flight.
\*
\* Expect: exit 0.
\*
\* This is the only config in which retireSource() runs. Run R1's seen set
\* holds just "a", so the sources query returns the other row and the run
\* retires it:
\*   - from the "owned by s2" initial state, R1's pre-check sees "foreign" and
\*     skips with PROCESSOR_PATH_COLLISION, then retirement drops s2's
\*     ownership row and the documents row with it (deleteOwnedOutput removes
\*     the document only while the (collection, s2, path) row exists);
\*   - from the "no rows" and "raw row" initial states, nothing of s2 exists
\*     to retire, and s1's own publication or skip is unaffected.
\* Both are reachable, so this run also covers "a retired source never deletes
\* a document another source owns" and "retirement leaves no half state".
SPECIFICATION Spec

CONSTANTS
    OldSource = s1
    NewSource = s2
    Active = {s1}
    RecheckInside = TRUE
    OwnershipCheck = TRUE

INVARIANTS TypeOK ContentMatchesOwner RawRowNotClaimed FingerprintMatchesPublished

CHECK_DEADLOCK FALSE
