\* ABLATION 3: stop signals whichever PID the file records, without requiring
\* the process probe to classify it as a live qmd daemon. This is the "the
\* pidfile is the source of truth, just kill it" simplification of
\* stopMcpDaemon/stopRunningDaemon; it is the recycled-PID hazard #806 fixed.
\*
\* Expect: exit 12, "Invariant NoUnverifiedSignal is violated".
\*
\* Shortest trace (1 step):
\*   initial state  the file records OldPid, a live PID whose cmdline is not
\*                  qmd (post-reboot reuse); ident[OldPid] = foreign
\*   StopBegin      SignalGate = FALSE treats the stale file as signallable
\*   => process.kill(OldPid, SIGTERM) is sent to an unrelated program:
\*      unsafeSignal = TRUE.
\*
\* The shipped stop first classifies the file: stale/malformed go to the
\* re-checking cleanup and only `running` reaches process.kill. Signalling a
\* PID that a second probe would reject is also why the identity result may not
\* be cached across a start/stop decision (assumption A1).
SPECIFICATION Spec

CONSTANTS
    Procs = {s1, s2}
    OldPid = old
    IdentityGate = TRUE
    RecheckStale = TRUE
    SignalGate = FALSE
    KeepTrackingOnTimeout = TRUE

INVARIANTS TypeOK NoUnverifiedSignal AtMostOneServing AtMostOneOwner
           ClaimedOwnerIsNamed NoUnverifiedDeletion TimeoutPreservesTracking

CHECK_DEADLOCK FALSE
