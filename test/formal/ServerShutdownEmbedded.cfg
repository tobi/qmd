\* SHIPPED EMBEDDED: same bounded teardown, but the host is never exited
\* (EarlyExitOnTimeout = FALSE). A reported timeout rejects the stop() promise
\* and cleanup continues in the background; the process stays alive, and its
\* exit code is the host's business.
\* Expect: exit 0 -- every invariant holds; `proc` simply never reaches
\* "exited" on the timeout path, which is exactly the embedded contract.
SPECIFICATION Spec

CONSTANTS
    Reqs = {"r1"}
    Callers = {"sigterm", "sigint"}
    AdmissionGate = TRUE
    SharedStop = TRUE
    DrainAtAll = TRUE
    BoundedDrain = TRUE
    AbandonAtDeadline = TRUE
    CloseTransportAtStop = FALSE
    EarlyExitOnTimeout = FALSE

INVARIANTS
    TypeOK
    SaneShutdownOrder
    NoTransportCloseUnderHandler
    NoStoreCloseUnderHandler
    StoppedImpliesStoreClosed
    ReportedTimeoutImpliesAbandoned
    CleanExitImpliesTeardown
    TimeoutExitImpliesWork

CHECK_DEADLOCK FALSE
