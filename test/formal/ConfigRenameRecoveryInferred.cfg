\* BROKEN CONTROL -- not the current code. Recovery is inferred from the file
\* shape: whenever the configuration no longer lists the old name and lists
\* another one, the old name's documents are moved into it. An unrelated
\* collection can own that name, so ownership is corrupted without any rename
\* having been published.
\* Expect: exit 12, invariant NoMoveWithoutPublication.
SPECIFICATION Spec
CONSTANTS
  MoveGate = "inferred"
  MutationGate = "reject"

INVARIANTS TypeOK NoMoveWithoutPublication
CHECK_DEADLOCK FALSE
