\* PRE-FIX PUBLIC CLEAR -- regression evidence. clearAllEmbeddings did not take
\* the index's embed lock, so it could drop the vec0 table or delete a
\* collection's partition rows while an embedding run held the lock and was
\* publishing into them. The run is otherwise the current one (LockDomain=TRUE).
\* Expect: exit 12, "Invariant NoClearDuringRun is violated".
SPECIFICATION Spec

CONSTANTS
    LockDomain = TRUE
    AtomicDelete = FALSE
    ClearMode = "unguarded"
    Clears = TRUE

INVARIANTS TypeOK NoClearDuringRun

CHECK_DEADLOCK FALSE
