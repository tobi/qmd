\* ABLATION 2: both ownership guards removed -- the pre-publication look and
\* the in-savepoint re-check. This is what "the primary key on
\* (collection, path) already prevents double ownership" reasoning produces: it
\* does, but the primary key protects the ownership table, not the documents
\* row, and not a documents row with no ownership row at all.
\*
\* Same episode as ProcessorReindex.cfg. The row this run may not claim is
\* older than both enumerations: a plain scan of a generation where "a" was a
\* directory indexed "a/x/y", and that documents row outlived the replacement
\* of file "a" by that directory.
\*
\* Expect: exit 12, an ownership invariant violated -- RawRowNotClaimed or
\* ContentMatchesOwner, depending on exploration order.
\*
\* Shortest trace for RawRowNotClaimed (3 steps):
\*   initial state      documents row at "a/x/y", active, written by a plain
\*                      scan; no processor_outputs row
\*   Inspect(s1)        R1 read "a", processor returned key "x/y"
\*   PrecheckPasses(s1) would skip with PROCESSOR_PATH_COLLISION; guard removed
\*   Publish(s1)        updates the existing row and inserts the ownership row
\*                      with source = s1
\*   => the raw row is now a processor output: s1 owns content it did not
\*      create, and the final pass no longer sees the row as raw.
\*
\* Equally short: start from the already-published state (owner = s2, s2's
\* fingerprint recorded) and let s1 publish over it. The upsert keeps
\* source = s2 while the documents row gets s1's markdown, violating
\* ContentMatchesOwner.
SPECIFICATION Spec

CONSTANTS
    OldSource = s1
    NewSource = s2
    Active = {s1, s2}
    RecheckInside = FALSE
    OwnershipCheck = FALSE

INVARIANTS TypeOK ContentMatchesOwner RawRowNotClaimed FingerprintMatchesPublished

CHECK_DEADLOCK FALSE
