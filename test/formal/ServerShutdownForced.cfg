\* NEGATIVE CONTROL (mutant): the deadline tears the store down instead of
\* abandoning the work safely (AbandonAtDeadline = FALSE). This is what an
\* implementation that "stops" at the deadline by closing the store underneath
\* the admitted request does -- the exact temptation this design rejects.
\* Expect: exit 12 -- the first violated property is the concrete safety one,
\* NoStoreCloseUnderHandler. This config deliberately does NOT assert
\* SaneShutdownOrder: that is a meta-ordering sanity check for the shipped
\* order, and asserting it here would mask the race this control exists to
\* show.
\*
\* Trace:
\*   <Initial>       lifecycle "serving", store open
\*   Arrive(r1)      admitted; the handler starts reading its body
\*   EnterStop(sigterm) beginDrain() -> "draining", httpServer.close()
\*   DrainDeadline   the deadline fires with r1 active; the mutant disposes the
\*                   store at once => StoreCloseUnderHandler.
\* Kept as a witness: the shipped ServerShutdown.cfg sets AbandonAtDeadline =
\* TRUE and reports the timeout without touching the store.
SPECIFICATION Spec

CONSTANTS
    Reqs = {"r1"}
    Callers = {"sigterm", "sigint"}
    AdmissionGate = TRUE
    SharedStop = TRUE
    DrainAtAll = TRUE
    BoundedDrain = TRUE
    AbandonAtDeadline = FALSE
    CloseTransportAtStop = FALSE
    EarlyExitOnTimeout = TRUE

INVARIANTS
    TypeOK
    NoStoreCloseUnderHandler
    NoTransportCloseUnderHandler
    StoppedImpliesStoreClosed
    ReportedTimeoutImpliesAbandoned
    CleanExitImpliesTeardown
    TimeoutExitImpliesWork

CHECK_DEADLOCK FALSE
