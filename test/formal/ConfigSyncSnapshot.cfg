\* PRE-FIX STORE OPEN. The store reads the YAML with no lock (snapshot S) and
\* syncs S into store_collections afterwards, stamping S's hash. A collection a
\* concurrent mutation published to the file and its mirror in between is
\* deleted by the stale snapshot: the reported lost update.
\* Expect: exit 12, invariant Mirror.
SPECIFICATION Spec
CONSTANTS
  SyncMode = "snapshot"
  MutationMode = "locked"
  Mutates = TRUE

INVARIANTS TypeOK Mirror
CHECK_DEADLOCK FALSE
