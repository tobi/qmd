\* NEGATIVE CONTROL (legacy code): before the lifecycle refactor -- no
\* admission gate, no shared stop promise, no drain, no deadline.
\* Expect: exit 12 from a concrete safety property. Three independent
\* violations are reachable; the checker prints whichever it reaches first:
\*
\* (a) NoStoreCloseUnderHandler:
\*   <Initial>, Arrive(r1), ReadBody(r1), EnterStop(sigterm), TransportClosed
\*   => store.close() is entered at once while r1 still reads its body.
\*
\* (b) NoTransportCloseUnderHandler:
\*   <Initial>, Arrive(r1), ReadBody(r1), EnterStop(sigterm)
\*   => mcpHandler.close() is issued while r1 still runs.
\*
\* (c) CleanExitImpliesTeardown:
\*   <Initial>, EnterStop(sigterm), LaterSignal(sigint) returns from
\*   `if (stopping) return`, Exit(sigint)
\*   => process.exit(0) with the store still open: llama.cpp never disposed,
\*      SQLite never closed, teardown still pending.
\*
\* SaneShutdownOrder is deliberately not asserted here: it is the meta-ordering
\* sanity check for the shipped order, and asserting it in a control would hide
\* the concrete safety failure the control exists to show.
\* This config has no deadline at all (BoundedDrain = FALSE), which is why the
\* old shipped design could not report a timeout: a stalled client kept the
\* process alive forever. The shipped config bounds it and reports instead.
SPECIFICATION Spec

CONSTANTS
    Reqs = {"r1"}
    Callers = {"sigterm", "sigint"}
    AdmissionGate = FALSE
    SharedStop = FALSE
    DrainAtAll = FALSE
    BoundedDrain = FALSE
    AbandonAtDeadline = FALSE
    CloseTransportAtStop = TRUE
    EarlyExitOnTimeout = FALSE

INVARIANTS
    TypeOK
    NoStoreCloseUnderHandler
    NoTransportCloseUnderHandler
    StoppedImpliesStoreClosed
    ReportedTimeoutImpliesAbandoned
    CleanExitImpliesTeardown
    TimeoutExitImpliesWork

CHECK_DEADLOCK FALSE
