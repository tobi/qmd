\* CURRENT CODE. A rename writes its old→new marker before publishing the
\* configuration, moves the index state only against that exact marker (or the
\* publication it just made), and refuses any mutation that would clobber a live
\* marker. A marker whose publication never landed is stale and is dropped.
\* This config explores both crashes (before and after the publication).
\* Expect: exit 0, TypeOK, NoMoveWithoutPublication and EvidenceNotClobbered.
SPECIFICATION Spec
CONSTANTS
  MoveGate = "evidence"
  MutationGate = "reject"

INVARIANTS TypeOK NoMoveWithoutPublication EvidenceNotClobbered
CHECK_DEADLOCK FALSE
