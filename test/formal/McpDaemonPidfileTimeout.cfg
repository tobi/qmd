\* ABLATION 4: a stop that times out removes the pidfile. This is the
\* plausible "the deadline expired, so drop the file and let the next start
\* clean up" simplification of stopRunningDaemon; the shipped branch returns
\* {outcome:"timeout"} and leaves the file alone.
\*
\* Expect: exit 12, "Invariant TimeoutPreservesTracking is violated".
\*
\* Shortest trace (5 steps):
\*   Spawn(s1)      file absent; s1's child is spawned
\*   ChildExecs(s1) the child identifies as qmd and enters the ownership wait
\*   Claim(s1)      the section publishes s1; granted = {s1}
\*   StopBegin      classification `running`: SIGTERM s1 and wait
\*   StopTimeout    s1 is still alive and qmd at the deadline; the mutant
\*                  unlinks the file instead of keeping it
\*   => stopOutcome = "timeout" with timeoutKeptFile = FALSE, and s1 is a live
\*      daemon that stop/status can no longer find. The same state violates
\*      ClaimedOwnerIsNamed; the timeout invariant is listed first because
\*      keeping the file is what makes a retry possible.
\*
\* The daemon may be `waiting` rather than `serving` here: `qmd mcp stop`
\* signals any identified daemon, and an untracked waiting child is just as
\* lost to a retry as an untracked listener.
SPECIFICATION Spec

CONSTANTS
    Procs = {s1, s2}
    OldPid = old
    IdentityGate = TRUE
    RecheckStale = TRUE
    SignalGate = TRUE
    KeepTrackingOnTimeout = FALSE

INVARIANTS TypeOK TimeoutPreservesTracking AtMostOneOwner
           AtMostOneServing NoUnverifiedDeletion NoUnverifiedSignal

CHECK_DEADLOCK FALSE
