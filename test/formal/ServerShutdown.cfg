\* SHIPPED STANDALONE: the 5 s deadline bounds the whole teardown. Admitted
\* work may finish inside the grace; if it does not, stop() reports a typed
\* timeout (stopOutcome = "timeout"), the remaining requests are aborted, and
\* the cleanup continues in the background in the same safe order -- unbounded
\* wait for idle, transport, listener, store, then `stopped`. The standalone
\* entry exits non-zero ("abandoned") immediately after the report because
\* work remains.
\* Expect: exit 0 -- every invariant holds, including NoStoreCloseUnderHandler
\* on the timeout path and StoppedImpliesStoreClosed.
\*
\* Two traces worth naming:
\*   grace:    Arrive(r1), EnterStop(sigterm), SearchDone(r1), DrainIdle,
\*             TransportClosed, ListenerClosed, StoreClosed, Exit(sigterm) -> clean
\*   timeout:  Arrive(r1), EnterStop(sigterm), DrainDeadline (r1 still active),
\*             AbandonWork(r1), ReportWaitIdle, TransportClosed,
\*             ListenerClosed, StoreClosed, Exit(sigterm) -> abandoned
SPECIFICATION Spec

CONSTANTS
    Reqs = {"r1"}
    Callers = {"sigterm", "sigint"}
    AdmissionGate = TRUE
    SharedStop = TRUE
    DrainAtAll = TRUE
    BoundedDrain = TRUE
    AbandonAtDeadline = TRUE
    CloseTransportAtStop = FALSE
    EarlyExitOnTimeout = TRUE

INVARIANTS
    TypeOK
    SaneShutdownOrder
    NoTransportCloseUnderHandler
    NoStoreCloseUnderHandler
    StoppedImpliesStoreClosed
    ReportedTimeoutImpliesAbandoned
    CleanExitImpliesTeardown
    TimeoutExitImpliesWork

CHECK_DEADLOCK FALSE
