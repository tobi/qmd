\* BROKEN CONTROL -- not the current code. A mutation touching one of a live
\* rename marker's names (here: removing the target) is allowed to clear the
\* marker, so the only evidence of the unfinished rename is lost while the old
\* name's documents are still in the index.
\* Expect: exit 12, invariant EvidenceNotClobbered.
SPECIFICATION Spec
CONSTANTS
  MoveGate = "evidence"
  MutationGate = "clobber"

INVARIANTS TypeOK EvidenceNotClobbered
CHECK_DEADLOCK FALSE
