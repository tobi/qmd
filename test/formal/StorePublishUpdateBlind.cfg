\* PRE-FIX CODE -- regression evidence, not the current implementation. The
\* publisher read the corpus into a private shadow FTS table with no
\* transaction and no lock, then took BEGIN IMMEDIATE to DELETE
\* documents_fts, copy the shadow in and stamp, with no reconciliation at all.
\* A `qmd update` committing in between is either lost (a new document ends up
\* with no FTS row) or overwritten with the text the shadow captured.
\* Expect: exit 12, "Invariant FtsSeesActiveDocument is violated".
SPECIFICATION Spec

CONSTANTS
    MaxGen = 2
    PublishMode = "blind"

INVARIANTS TypeOK FtsSeesActiveDocument

CHECK_DEADLOCK FALSE
