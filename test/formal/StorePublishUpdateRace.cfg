\* CURRENT CODE. The publisher reads the corpus into a private shadow FTS table
\* (plus a per-row identity snapshot) with no transaction and no lock, and only
\* then takes BEGIN IMMEDIATE, where it reconciles the snapshot against
\* documents -- re-reading rows that changed, dropping rows of deactivated
\* documents, adding documents the snapshot never saw -- before copying the
\* shadow into documents_fts and stamping.
\* Expect: exit 0, TypeOK and FtsSeesActiveDocument hold.
SPECIFICATION Spec

CONSTANTS
    MaxGen = 2
    PublishMode = "reconcile"

INVARIANTS TypeOK FtsSeesActiveDocument

CHECK_DEADLOCK FALSE
