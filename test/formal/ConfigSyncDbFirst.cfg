\* PRE-FIX SDK MUTATION, refused config write. SQLite is written before the
\* config lock is taken, so a file write that fails leaves a database-only edit
\* behind and the next sync silently drops it.
\* Expect: exit 12, invariant Mirror.
SPECIFICATION Spec
CONSTANTS
  SyncMode = "locked"
  MutationMode = "dbFirst"
  Mutates = TRUE

INVARIANTS TypeOK Mirror
CHECK_DEADLOCK FALSE
