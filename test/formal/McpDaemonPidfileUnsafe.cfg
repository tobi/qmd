\* ABLATION 1: the claim publishes the freshly spawned child before it has
\* identified itself. This is the plausible "spawn() already gave us a PID, why
\* wait?" simplification: the parent skips waitForDaemonChildIdentity (or the
\* identity check in claimMcpDaemonPidfile) and writes the warming PID.
\*
\* Expect: exit 12, "Invariant AtMostOneOwner is violated".
\*
\* Shortest trace (4 steps):
\*   Spawn(s1)   s1 spawned, ident[s1] = warming, file names old/absent
\*   Claim(s1)   identity gate removed: publishes s1 anyway, grants s1
\*   Spawn(s2)   the file's PID is warming, so it classifies stale; the start
\*               pre-check lets the second contender in
\*   Claim(s2)   same stale classification: replaces the file with s2 and
\*               grants s2 as well
\*   => granted = {s1, s2}: two live claims, while only s2 is named.
\*
\* The same state violates ClaimedOwnerIsNamed for s1: starter s1 reported
\* "Started (PID s1)" (qmd.ts) but the pidfile now names s2, so the later
\* `qmd mcp stop`/`status` cannot find s1's child. The child itself is still
\* stopped from serving by its ownership wait, which is why AtMostOneServing is
\* listed after the claim invariants: the ownership token gate is a second,
\* independent line of defence, not a substitute for a sound identity-gated
\* claim.
SPECIFICATION Spec

CONSTANTS
    Procs = {s1, s2}
    OldPid = old
    IdentityGate = FALSE
    RecheckStale = TRUE
    SignalGate = TRUE
    KeepTrackingOnTimeout = TRUE

INVARIANTS TypeOK AtMostOneOwner AtMostOneServing
           NoUnverifiedDeletion NoUnverifiedSignal TimeoutPreservesTracking

CHECK_DEADLOCK FALSE
