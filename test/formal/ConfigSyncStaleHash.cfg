\* PRE-FIX SDK MUTATION, successful config write. The rows are written without
\* invalidating config_hash, so the hash keeps certifying the document the rows
\* came from: an open whose file matches that hash would skip the sync and leave
\* the rows uncorrected.
\* Expect: exit 12, invariant CertCurrent.
SPECIFICATION Spec
CONSTANTS
  SyncMode = "locked"
  MutationMode = "dbFirst"
  Mutates = TRUE

INVARIANTS TypeOK CertCurrent
CHECK_DEADLOCK FALSE
