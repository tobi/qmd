\* ABLATION 2: stale cleanup deletes on the caller's earlier classification,
\* without re-reading inside the sidecar section. This is the "we already
\* looked at it, the path is stale" simplification of
\* removeStaleMcpDaemonPidfile.
\*
\* Expect: exit 12, "Invariant NoUnverifiedDeletion is violated".
\*
\* Shortest trace (5 steps):
\*   StopBegin      the file names OldPid, whose cmdline is not qmd; the stop
\*                  records a stale hint and moves to cleanup
\*   Spawn(s1)      a starter passes its own pre-check (the file is stale)
\*   ChildExecs(s1) the child identifies as qmd
\*   Claim(s1)      the section publishes s1; the file is now a live daemon
\*   StopCleanup    with the re-check removed it unlinks unconditionally:
\*                  the "stale" hint is applied to a file that now names a
\*                  live qmd daemon
\*   => unsafeDelete = TRUE; ClaimedOwnerIsNamed also fails (granted s1, no
\*      file), because s1 is now a serving-or-waiting daemon nobody tracks.
\*
\* If s1 had already served, the deletion would leave it serving untracked and
\* a third starter would claim the absent file and serve as well, which is how
\* AtMostOneServing is reachable from the same ablation. The current code's
\* re-check instead answers "kept", the stop loop re-decides from the new
\* contents (StopBegin again) and signals s1, which is why the mutation is not
\* equivalent to the shipped cleanup.
SPECIFICATION Spec

CONSTANTS
    Procs = {s1, s2}
    OldPid = old
    IdentityGate = TRUE
    RecheckStale = FALSE
    SignalGate = TRUE
    KeepTrackingOnTimeout = TRUE

INVARIANTS TypeOK NoUnverifiedDeletion AtMostOneOwner
           AtMostOneServing NoUnverifiedSignal TimeoutPreservesTracking

CHECK_DEADLOCK FALSE
