\* PRE-FIX CODE -- regression evidence, not the current implementation. Only the
\* CLI held the embed lock, so SDK store.embed() and direct generateEmbeddings
\* calls ran unserialized: A's delete can straddle B's commit and remove the
\* complete hash. Clears=FALSE keeps the public clear out of this config, so the
\* violation is the cleanup race itself.
\* Expect: exit 12, "Invariant CompletedVectorsRemain is violated".
SPECIFICATION Spec

CONSTANTS
    LockDomain = FALSE
    AtomicDelete = FALSE
    ClearMode = "guarded"
    Clears = FALSE

INVARIANTS TypeOK CompletedVectorsRemain

CHECK_DEADLOCK FALSE
