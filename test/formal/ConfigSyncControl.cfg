\* CONTROL. The pre-fix lock-free snapshot sync with no concurrent writer: the
\* snapshot is always current, so the same steps are harmless. The violations in
\* the other configs come from the interleaving, not from the sync being a no-op.
\* Expect: exit 0, TypeOK, Mirror and CertCurrent hold.
SPECIFICATION Spec
CONSTANTS
  SyncMode = "snapshot"
  MutationMode = "locked"
  Mutates = FALSE

INVARIANTS TypeOK Mirror CertCurrent
CHECK_DEADLOCK FALSE
