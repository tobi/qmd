\* CURRENT CODE: both ownership checks in place -- the cheap look before the
\* write transaction and the same question re-read inside the savepoint.
\*
\* Two runs, one output path: run R1 enumerated source "a" (s1) while "a" was a
\* regular file; a user replaced it with a directory holding "x"; run R2
\* enumerated "a/x" (s2). Both publish to "a/x/y" -- from two enumerations,
\* never from one.
\*
\* Expect: exit 0; every reachable state of this model checked.
\*
\* What the pass means here: s2's inspection can finish while the path is still
\* unowned, s1 can publish in between (publication touches rows only), and s2's
\* publication is then refused either by the pre-check (it runs after that
\* publication) or by the re-check (its look happened before it). The re-check
\* rolls the savepoint back and aborts that run. Neither order credits the path
\* to a source whose markdown is not the one published there, and a source that
\* reused its fingerprint still owns what it reused.
SPECIFICATION Spec

CONSTANTS
    OldSource = s1
    NewSource = s2
    Active = {s1, s2}
    RecheckInside = TRUE
    OwnershipCheck = TRUE

INVARIANTS TypeOK ContentMatchesOwner RawRowNotClaimed FingerprintMatchesPublished

CHECK_DEADLOCK FALSE
