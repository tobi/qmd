\* CURRENT CODE: both identity gates, the in-section stale re-check and the
\* stop timeout's tracking behaviour are in place.
\*
\* Expect: exit 0; every reachable state of this model checked.
\*
\* What the pass means here: of two concurrent starters only the claim that
\* runs first publishes its PID, the loser's child is not named and therefore
\* never serves, a graceful exit removes only a file that still records that
\* PID, a crashed daemon's stale file is reclassified before anyone unlinks or
\* signals it, and a stop that times out leaves the daemon's pidfile intact.
\* The model also covers the two recoveries: a starter that dies before
\* claiming leaves its child unnamed (it exits), and a SIGKILL leaves a stale
\* pidfile that the next claim or stop cleanup replaces.
SPECIFICATION Spec

CONSTANTS
    Procs = {s1, s2}
    OldPid = old
    IdentityGate = TRUE
    RecheckStale = TRUE
    SignalGate = TRUE
    KeepTrackingOnTimeout = TRUE

INVARIANTS TypeOK AtMostOneServing AtMostOneOwner ClaimedOwnerIsNamed
           NoUnverifiedDeletion NoUnverifiedSignal TimeoutPreservesTracking

CHECK_DEADLOCK FALSE
