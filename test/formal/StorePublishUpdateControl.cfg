\* CONTROL, HYPOTHETICAL -- not the current code. PublishMode = "lock" models
\* taking the writer lock (BEGIN IMMEDIATE) before the shadow read instead of
\* after it, so the snapshot and the publish are the same atomic boundary and a
\* concurrent writer either lands entirely before the read or entirely after the
\* publish. Correct, and it blocks other writers for the whole rebuild, which is
\* why the shipped code reconciles inside the publish transaction instead.
\* Expect: exit 0, TypeOK and FtsSeesActiveDocument hold.
SPECIFICATION Spec

CONSTANTS
    MaxGen = 2
    PublishMode = "lock"

INVARIANTS TypeOK FtsSeesActiveDocument

CHECK_DEADLOCK FALSE
